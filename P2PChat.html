<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2PChat — IPv6/IPv4 P2P 聊天</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ee; --mut:#8b93a7; --acc:#4c8dff; --acc2:#2f6fe0;
    --ok:#37d27a; --warn:#f0a93b; --err:#ef5454;
    --bubble-out:#2f6fe0; --bubble-in:#262b36;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",-apple-system,"Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;overflow:hidden;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer;border:none;border-radius:8px;padding:8px 12px;color:#fff;background:var(--acc);transition:.15s}
  button:hover{background:var(--acc2)}
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  button.ghost:hover{background:var(--panel2)}
  button.danger{background:var(--err)}
  button.sm{padding:5px 9px;font-size:12px}
  input,textarea{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{resize:vertical}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#333a47;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:flex;height:100vh;width:100vw}

  /* 侧栏 */
  #sidebar{width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side-head{padding:12px;border-bottom:1px solid var(--line)}
  .side-head h1{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .side-head .me{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
  .side-head .me b{color:var(--txt)}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #contactList{flex:1;overflow-y:auto;padding:6px}
  .contact{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
  .contact:hover{background:var(--panel2)}
  .contact.active{background:var(--panel2)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .c-main{flex:1;min-width:0}
  .c-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-ip{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,monospace}
  .c-time{font-size:10px;color:var(--mut);flex:none}

  /* 主区 */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel)}
  .topbar .title{font-weight:600}
  .topbar .sub{font-size:11px;color:var(--mut);font-family:Consolas,monospace}
  .topbar .spacer{flex:1}
  .status{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--panel2);color:var(--mut)}
  .status.connected{color:var(--ok)}
  .status.connecting{color:var(--warn)}
  #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:72%;padding:8px 12px;border-radius:12px;word-break:break-word;white-space:pre-wrap}
  .msg.out{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
  .msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
  .msg .t{font-size:10px;opacity:.7;margin-top:3px}
  .sys{align-self:center;font-size:11px;color:var(--mut);background:var(--panel2);padding:3px 10px;border-radius:10px}
  #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);text-align:center;padding:20px}
  #empty h2{color:var(--txt);font-weight:600}
  .composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:var(--panel)}
  #inputMsg{flex:1;min-height:42px;max-height:120px}
  #inputMsg:disabled{opacity:.5}
  .notconn{padding:18px;margin:14px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--mut)}
  .notconn button{margin:0 4px}

  /* 模态 */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:560px;max-width:94vw;max-height:90vh;overflow:auto;padding:20px}
  .modal h2{margin:0 0 6px;font-size:17px}
  .modal .desc{color:var(--mut);font-size:12px;margin-bottom:14px}
  .modal .step{font-size:12px;color:var(--acc);font-weight:600;margin-bottom:6px}
  .codebox{width:100%;height:120px;font-family:Consolas,monospace;font-size:11px;word-break:break-all}
  .row{display:flex;gap:8px;align-items:center;margin:10px 0}
  .row label{width:80px;color:var(--mut);font-size:12px;flex:none}
  .row input{flex:1}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .hint{font-size:11px;color:var(--mut);background:var(--panel2);padding:8px 10px;border-radius:8px;margin-top:10px}
  .field{margin:8px 0}
  .field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
  .pill{font-size:11px;color:var(--mut);font-family:Consolas,monospace;background:var(--panel2);padding:2px 6px;border-radius:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:9px 18px;border-radius:8px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}

  /* 移动端响应式 */
  #btnBack{display:none !important}
  @media (max-width:680px){
    #app{flex-direction:column}
    #sidebar{width:100%;min-width:0;height:100%}
    #main{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);transform:translateX(100%);transition:transform .22s ease;z-index:20}
    #app.show-chat #main{transform:translateX(0)}
    #app.show-chat #sidebar{display:none}
    #btnBack{display:inline-block !important;font-size:20px;padding:2px 10px;line-height:1}
    .side-head h1{font-size:15px}
    .toolbar button{padding:7px 10px;font-size:12px}
    .modal{width:100%;border-radius:0}
    .overlay{align-items:flex-end}
    .codebox{height:90px}
    .msg{max-width:84%}
    .topbar{height:48px}
    .topbar .sub{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
</style>
</head>
<body>
<div id="app">
  <!-- 侧栏 -->
  <aside id="sidebar">
    <div class="side-head">
      <h1>🌍 P2PChat</h1>
      <div class="me">我：<b id="myName">—</b> <span class="pill" id="myId">—</span></div>
      <div class="toolbar">
        <button onclick="startInvite()">➕ 新建连接</button>
        <button class="ghost" onclick="startAccept()">📥 接受连接</button>
        <button class="ghost" onclick="exportJSON()">⬇ 导出</button>
        <button class="ghost" onclick="importJSON()">⬆ 导入</button>
        <button class="ghost" onclick="openSettings()">⚙ 设置</button>
      </div>
    </div>
    <div id="contactList"></div>
  </aside>

  <!-- 主区 -->
  <main id="main">
    <div class="topbar">
      <button class="ghost sm" id="btnBack" onclick="goBack()" style="display:none">‹</button>
      <div>
        <div class="title" id="topTitle">未选择联系人</div>
        <div class="sub" id="topSub"></div>
      </div>
      <div class="spacer"></div>
      <span class="status" id="topStatus">未连接</span>
      <button class="ghost sm" id="btnDetail" onclick="openDetail()" style="display:none">详情/编辑</button>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <textarea id="inputMsg" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button onclick="sendMsg()">发送</button>
    </div>
  </main>
</div>

<!-- 连接向导 -->
<div class="overlay" id="dlgConnect">
  <div class="modal">
    <h2 id="dlgTitle">建立连接</h2>
    <div class="desc">基于 WebRTC 端到端加密直连。双方各需复制粘贴一段连接码完成握手。</div>
    <div id="dlgBody"></div>
    <div class="actions">
      <button class="ghost" onclick="closeDialog('dlgConnect')">取消</button>
    </div>
  </div>
</div>

<!-- 联系人详情 -->
<div class="overlay" id="dlgDetail">
  <div class="modal">
    <h2>联系人详情</h2>
    <div class="desc">修改备注与 IP（IP 为识别用，自动重连需重新交换连接码）。</div>
    <div class="field"><label>备注名</label><input id="dName"></div>
    <div class="field"><label>IPv6 / IPv4 地址</label><input id="dIp" placeholder="如 2001:db8::1 或 192.168.1.5"></div>
    <div class="field"><label>备注</label><textarea id="dNote" rows="3"></textarea></div>
    <div class="row"><label>最后联系</label><span class="pill" id="dSeen">—</span></div>
    <div class="actions">
      <button class="danger" onclick="deleteContact()">删除联系人</button>
      <button class="ghost" onclick="clearHistory()">清空记录</button>
      <button onclick="saveDetail()">保存</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="overlay" id="dlgSettings">
  <div class="modal">
    <h2>设置</h2>
    <div class="field"><label>我的显示名</label><input id="setName"></div>
    <div class="field"><label>STUN 服务器（每行一个，IPv4 跨网用；IPv6/局域网可留空）</label>
      <textarea id="setStun" rows="4" style="font-family:Consolas,monospace"></textarea></div>
    <div class="field" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="setDirect" onchange="toggleDirectOnly()" style="width:auto">
      <label for="setDirect" style="margin:0;cursor:pointer">仅 IPv6/局域网直连（禁用 STUN，不联系任何外部服务）</label>
    </div>
    <div class="hint" id="directHint" style="display:none">已禁用 STUN：仅使用本机 host 候选直连。需双方均为全局 IPv6 或同一局域网，且系统防火墙放行入站 UDP；跨网 IPv6 若连不上，Chrome 可在 <span class="pill">chrome://flags</span> 关闭 mDNS 混淆或改回启用 STUN。</div>
    <div class="hint">提示：因 WebRTC 会话信息每次临时生成，已保存联系人无法凭 IP 自动重连，每次重连仍需重新交换一次连接码。</div>
    <div class="actions">
      <button class="ghost" onclick="closeDialog('dlgSettings')">取消</button>
      <button onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json,.json" style="display:none">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===================== 数据层 ===================== */
const STORE_KEY = "ipvchat_data";
const DEFAULT_STUN = ["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"];

let store = loadStore();
let currentId = null;          // 当前选中联系人 id
let pendingPC = null;          // 握手中的 PeerConnection
let pendingRole = null;        // 'offer' | 'answer'
let pendingChannel = null;
let connections = new Map();   // contactId -> channel (已确认身份的活跃连接)
let channelMap = new Map();    // channel -> {pc, contactId|null}

function defaultStore(){
  return {
    version:1,
    identity:{ id: randId(), name:"用户"+Math.floor(Math.random()*9000+1000) },
    contacts:[],
    messages:{},
    settings:{ stunServers:[...DEFAULT_STUN], directOnly:false }
  };
}
function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultStore();
    const d = JSON.parse(raw);
    if(!d.identity) d.identity = defaultStore().identity;
    if(!d.contacts) d.contacts = [];
    if(!d.messages) d.messages = {};
    if(!d.settings || !d.settings.stunServers) d.settings = { stunServers:[...DEFAULT_STUN], directOnly:false };
    if(d.settings.directOnly===undefined) d.settings.directOnly = (d.settings.stunServers||[]).length===0;
    return d;
  }catch(e){ console.warn("load fail",e); return defaultStore(); }
}
function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){ console.warn("save fail",e); } }

function randId(){ return "p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function nowTs(){ return Date.now(); }
function fmtTime(ts){
  const d = new Date(ts), p=n=>String(n).padStart(2,'0');
  const today=new Date(); const same = d.toDateString()===today.toDateString();
  return same? `${p(d.getHours())}:${p(d.getMinutes())}` : `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ===================== 联系人 ===================== */
function getContact(id){ return store.contacts.find(c=>c.id===id); }
function ensureContact(peerId, name){
  let c = getContact(peerId);
  if(!c){ c={id:peerId,name:name||("联系人"+(store.contacts.length+1)),ip:"",lastSeen:0,note:""}; store.contacts.push(c); }
  if(name && (!c.nameSet)) { c.name=name; } // 首次连接自动用对端名字
  return c;
}
function selectContact(id){ currentId=id; updateMobileView(); renderContacts(); renderChat(); }
function goBack(){ currentId=null; updateMobileView(); renderContacts(); renderChat(); }
function updateMobileView(){
  const app=document.getElementById('app');
  if(currentId) app.classList.add('show-chat'); else app.classList.remove('show-chat');
}

/* ===================== WebRTC ===================== */
function iceServers(){ return (store.settings.stunServers||[]).filter(u=>u).map(u=>({urls:u})); }
function newPC(){ return new RTCPeerConnection({ iceServers: iceServers() }); }

function waitIceComplete(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    let done=false;
    const check=()=>{ if(!done && pc.iceGatheringState==='complete'){ done=true; pc.removeEventListener('icegatheringstatechange',check); res(); } };
    pc.addEventListener('icegatheringstatechange',check);
    setTimeout(()=>{ if(!done){ done=true; pc.removeEventListener('icegatheringstatechange',check); res(); } }, 4000); // 兜底
  });
}

function encodeSignal(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function decodeSignal(s){ return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }

/* 邀请方：生成邀请码 */
async function startInvite(){
  pendingRole='offer';
  cleanupPending();
  const pc = newPC(); pendingPC = pc;
  const ch = pc.createDataChannel("chat",{ordered:true}); pendingChannel = ch;
  bindChannel(ch, pc, null, null);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceComplete(pc);
  const code = encodeSignal({type:"offer", sdp: pc.localDescription, identity: store.identity});
  showConnectDialog([
    {step:"第 1 步（共 3 步） · 你是邀请方", body:`
      <p style="font-size:12px;color:var(--mut)">把下面的<b>邀请码</b>发给对方（任意聊天工具），让对方点「接受连接」并粘贴。</p>
      <textarea class="codebox" id="codeOut" readonly>${code}</textarea>
      <div class="row"><button onclick="copyText(document.getElementById('codeOut').value)">复制邀请码</button></div>`},
    {step:"第 3 步 · 等对方回发应答码后粘贴", body:`
      <textarea class="codebox" id="codeIn" placeholder="在此粘贴对方回发的应答码..."></textarea>
      <div class="row"><button onclick="finalizeOffer()">完成连接</button></div>`}
  ]);
}
async function finalizeOffer(){
  const s = document.getElementById('codeIn').value.trim();
  if(!s) return toast("请粘贴应答码");
  try{
    const obj = decodeSignal(s);
    if(obj.type!=='answer') return toast("这不是应答码");
    await pendingPC.setRemoteDescription(new RTCSessionDescription(obj.sdp));
    toast("已提交，等待连接建立...");
    document.getElementById('dlgConnect').classList.remove('show');
  }catch(e){ toast("应答码无效: "+e.message); }
}

/* 被邀方：粘贴邀请码，生成应答码 */
async function startAccept(){
  pendingRole='answer';
  cleanupPending();
  showConnectDialog([
    {step:"第 2 步 · 你是被邀方", body:`
      <p style="font-size:12px;color:var(--mut)">粘贴对方发来的<b>邀请码</b>：</p>
      <textarea class="codebox" id="codeIn" placeholder="在此粘贴邀请码..."></textarea>
      <div class="row"><button onclick="acceptOffer()">生成应答码</button></div>`},
    {step:"生成后 · 把应答码回发给对方", body:`
      <textarea class="codebox" id="codeOut" readonly placeholder="应答码将显示在这里..."></textarea>
      <div class="row"><button onclick="copyText(document.getElementById('codeOut').value)">复制应答码</button></div>`}
  ]);
}
async function acceptOffer(){
  const s = document.getElementById('codeIn').value.trim();
  if(!s) return toast("请粘贴邀请码");
  try{
    const obj = decodeSignal(s);
    if(obj.type!=='offer') return toast("这不是邀请码");
    const pc = newPC(); pendingPC = pc;
    pc.ondatachannel = e=>{ pendingChannel = e.channel; bindChannel(e.channel, pc, obj.identity.id, obj.identity.name); };
    await pc.setRemoteDescription(new RTCSessionDescription(obj.sdp));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await waitIceComplete(pc);
    const code = encodeSignal({type:"answer", sdp: pc.localDescription, identity: store.identity});
    document.getElementById('codeOut').value = code;
    toast("已生成应答码，请复制回发给对方");
  }catch(e){ toast("邀请码无效: "+e.message); }
}

function bindChannel(channel, pc, knownPeerId, knownPeerName){
  channelMap.set(channel, {pc, contactId: knownPeerId||null});
  channel.onopen = ()=> onChannelOpen(channel, knownPeerId, knownPeerName);
  channel.onmessage = e=> onChannelMsg(channel, e.data);
  channel.onclose = ()=> onChannelClose(channel);
  channel.onerror = ()=> onChannelClose(channel);
  pc.oniceconnectionstatechange = ()=>{
    const st = pc.iceConnectionState;
    if(st==='failed'){ toast("ICE 连接失败，可能需更换网络或检查 STUN"); onChannelClose(channel); }
    else if(st==='disconnected'){ toast("连接中断，尝试恢复中..."); }
  };
}

function onChannelOpen(channel, peerId, peerName){
  // 先发送本机身份
  try{ channel.send(JSON.stringify({type:"hello", identity: store.identity})); }catch(e){}
  if(peerId){
    // 被邀方：邀请码里已带邀请方身份，直接登记
    finalizeChannel(channel, peerId, peerName);
  }else{
    // 邀请方：需等对端 hello 才知道身份
    toast("连接已建立，等待对端身份...");
  }
}
function onChannelMsg(channel, data){
  let m; try{ m=JSON.parse(data); }catch{ return; }
  if(m.type==='hello'){
    finalizeChannel(channel, m.identity.id, m.identity.name);
    return;
  }
  const info = channelMap.get(channel);
  const cId = info && info.contactId;
  if(!cId) return; // 身份未确认前丢弃业务消息
  if(m.type==='msg'){ addMessage(cId, 'in', m.text, m.ts); }
  else if(m.type==='bye'){ appendSys(cId,"对方已断开"); }
}
function finalizeChannel(channel, peerId, peerName){
  const info = channelMap.get(channel);
  if(!info) return;
  const oldId = info.contactId;
  if(oldId && oldId!==peerId) connections.delete(oldId);
  info.contactId = peerId;
  const c = ensureContact(peerId, peerName);
  connections.set(peerId, channel);
  if(pendingPC===info.pc) pendingPC=null; // 握手完成，不再算 pending
  pendingChannel=null;
  c.lastSeen = nowTs();
  detectPeerIp(info.pc, peerId);
  saveStore();
  closeDialog('dlgConnect');
  selectContact(peerId);
  if(!oldId) appendSys(peerId, "✅ 已建立加密直连");
  toast("已连接 "+c.name);
}
function currentConnId(){ // 当前选中且已连接
  if(currentId && connections.has(currentId)) return currentId;
  return null;
}
function onChannelClose(channel){
  const info = channelMap.get(channel); if(!info) return;
  const cId = info.contactId;
  channelMap.delete(channel);
  if(cId && connections.get(cId)===channel){
    connections.delete(cId);
    if(cId===currentId){ appendSys(cId,"连接已断开"); renderChat(); }
    renderContacts();
  }
}
function cleanupPending(){
  if(pendingPC){
    const inUse = [...channelMap.values()].some(i=>i.pc===pendingPC);
    if(!inUse){ try{ pendingPC.close(); }catch(e){} }
    pendingPC=null;
  }
  pendingChannel=null;
}
async function detectPeerIp(pc, contactId){
  try{
    await new Promise(r=>setTimeout(r,500));
    const stats = await pc.getStats();
    let ip="";
    stats.forEach(r=>{
      if(r.type==='candidate-pair' && r.selected){
        const rem = stats.get(r.remoteCandidateId);
        if(rem && rem.address) ip = rem.address;
        else if(rem && rem.ip) ip = rem.ip;
      }
    });
    if(ip){
      const c=getContact(contactId); if(c){ c.ip=ip; c.lastSeen=nowTs(); saveStore(); renderContacts(); if(contactId===currentId) renderTopbar(); }
    }
  }catch(e){}
}

/* 发送消息 */
function sendMsg(){
  const ta=document.getElementById('inputMsg');
  const text=ta.value.trim(); if(!text) return;
  const cId=currentConnId();
  if(!cId || !connections.has(cId)) return toast("未连接，无法发送");
  const channel=connections.get(cId);
  const ts=nowTs();
  try{ channel.send(JSON.stringify({type:"msg", ts, text})); }catch(e){ return toast("发送失败: "+e.message); }
  addMessage(cId,'out',text,ts);
  ta.value='';
}
function addMessage(contactId, dir, text, ts){
  if(!store.messages[contactId]) store.messages[contactId]=[];
  store.messages[contactId].push({ts:ts||nowTs(), dir, text});
  const c=getContact(contactId); if(c) c.lastSeen=ts||nowTs();
  saveStore();
  if(contactId===currentId) renderMessages();
  renderContacts();
}
function appendSys(contactId, text){
  if(!store.messages[contactId]) store.messages[contactId]=[];
  store.messages[contactId].push({ts:nowTs(), dir:'sys', text});
  saveStore();
  if(contactId===currentId) renderMessages();
}

/* ===================== 渲染 ===================== */
function renderAll(){ updateMobileView(); renderContacts(); renderChat(); renderIdentity(); }
function renderIdentity(){
  document.getElementById('myName').textContent = store.identity.name;
  document.getElementById('myId').textContent = store.identity.id;
}
function renderContacts(){
  const list=document.getElementById('contactList'); list.innerHTML='';
  if(store.contacts.length===0){ list.innerHTML='<div style="padding:16px;color:var(--mut);font-size:12px;text-align:center">暂无联系人<br>点「新建连接」开始</div>'; return; }
  // 按最后联系排序
  const sorted=[...store.contacts].sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  for(const c of sorted){
    const div=document.createElement('div');
    div.className='contact'+(c.id===currentId?' active':'');
    const last = c.lastSeen? fmtTime(c.lastSeen):'';
    div.innerHTML=`<span class="dot${connections.has(c.id)?' on':''}"></span>
      <div class="c-main"><div class="c-name">${escapeHtml(c.name)}</div>
      <div class="c-ip">${c.ip?escapeHtml(c.ip):'未知 IP'}</div></div>
      <div class="c-time">${last}</div>`;
    div.onclick=()=>selectContact(c.id);
    list.appendChild(div);
  }
}
function renderChat(){ renderTopbar(); renderMessages(); }
function renderTopbar(){
  const btn=document.getElementById('btnDetail');
  const ta=document.getElementById('inputMsg');
  if(!currentId){ document.getElementById('topTitle').textContent='未选择联系人'; document.getElementById('topSub').textContent=''; document.getElementById('topStatus').textContent=''; document.getElementById('topStatus').className='status'; btn.style.display='none'; ta.disabled=true; document.getElementById('messages').innerHTML=emptyHtml(); return; }
  const c=getContact(currentId); if(!c) return;
  document.getElementById('topTitle').textContent=c.name;
  document.getElementById('topSub').textContent=c.ip||'未知 IP';
  const st=document.getElementById('topStatus');
  if(connections.has(currentId)){ st.textContent='● 已连接'; st.className='status connected'; ta.disabled=false; }
  else{ st.textContent='● 未连接'; st.className='status'; ta.disabled=true; }
  btn.style.display='';
  if(!connections.has(currentId) && !hasMessages(currentId)) document.getElementById('messages').innerHTML=notConnHtml();
}
function renderMessages(){
  const box=document.getElementById('messages');
  if(!currentId){ box.innerHTML=emptyHtml(); return; }
  if(!connections.has(currentId) && !hasMessages(currentId)){ box.innerHTML=notConnHtml(); return; }
  const arr=store.messages[currentId]||[];
  box.innerHTML='';
  for(const m of arr){
    const el=document.createElement('div');
    if(m.dir==='sys'){ el.className='sys'; el.textContent=m.text; }
    else{ el.className='msg '+(m.dir==='out'?'out':'in'); el.innerHTML=escapeHtml(m.text)+`<div class="t">${fmtTime(m.ts)}</div>`; }
    box.appendChild(el);
  }
  box.scrollTop=box.scrollHeight;
}
function hasMessages(id){ return !!(store.messages[id]&&store.messages[id].length); }
function emptyHtml(){
  return `<div id="empty"><h2>🌍 P2PChat</h2><p>基于 WebRTC 的 IPv6/IPv4 端到端加密 P2P 聊天<br>无需服务器，单文件打开即用</p>
  <p style="margin-top:14px">点左侧「新建连接」或「接受连接」开始</p></div>`;
}
function notConnHtml(){
  return `<div class="notconn" style="margin:auto"><b>未与该联系人建立连接</b><br><br>
    因 WebRTC 会话信息每次临时生成，无法凭 IP 自动重连。<br>请重新交换一次连接码：
    <div style="margin-top:10px"><button onclick="startInvite()">我发起连接</button><button class="ghost" onclick="startAccept()">我接受连接</button></div></div>`;
}

/* ===================== 对话框 ===================== */
function showConnectDialog(steps){
  const body=document.getElementById('dlgBody'); body.innerHTML='';
  for(const s of steps){
    const sec=document.createElement('div'); sec.style.marginBottom='18px';
    sec.innerHTML=`<div class="step">${s.step}</div>${s.body}`;
    body.appendChild(sec);
  }
  document.getElementById('dlgConnect').classList.add('show');
}
function closeDialog(id){ document.getElementById(id).classList.remove('show'); }

/* 详情 */
function openDetail(){
  if(!currentId) return;
  const c=getContact(currentId);
  document.getElementById('dName').value=c.name;
  document.getElementById('dIp').value=c.ip||'';
  document.getElementById('dNote').value=c.note||'';
  document.getElementById('dSeen').textContent=c.lastSeen? new Date(c.lastSeen).toLocaleString():'—';
  document.getElementById('dlgDetail').classList.add('show');
}
function saveDetail(){
  const c=getContact(currentId); if(!c) return;
  c.name=document.getElementById('dName').value.trim()||c.name;
  c.ip=document.getElementById('dIp').value.trim();
  c.note=document.getElementById('dNote').value;
  c.nameSet=true; // 用户已自定义，后续不被对端名字覆盖
  saveStore(); renderAll(); closeDialog('dlgDetail'); toast("已保存");
}
function deleteContact(){
  if(!currentId) return;
  if(!confirm("确定删除该联系人及其聊天记录？")) return;
  const ch=connections.get(currentId);
  if(ch){ const info=channelMap.get(ch); if(info){ try{info.pc.close();}catch(e){} channelMap.delete(ch);} connections.delete(currentId); }
  store.contacts=store.contacts.filter(c=>c.id!==currentId);
  delete store.messages[currentId];
  currentId=null; saveStore(); renderAll(); closeDialog('dlgDetail'); toast("已删除");
}
function clearHistory(){
  if(!currentId) return;
  if(!confirm("清空与该联系人的聊天记录？")) return;
  store.messages[currentId]=[]; saveStore(); renderMessages(); closeDialog('dlgDetail'); toast("已清空");
}

/* 设置 */
function openSettings(){
  document.getElementById('setName').value=store.identity.name;
  const st=store.settings, direct = !!st.directOnly || (st.stunServers||[]).length===0;
  document.getElementById('setDirect').checked=direct;
  document.getElementById('setStun').value= direct? '' : (st.stunServers||[]).join('\n');
  document.getElementById('setStun').disabled=direct;
  document.getElementById('directHint').style.display= direct? 'block':'none';
  document.getElementById('dlgSettings').classList.add('show');
}
function toggleDirectOnly(){
  const direct=document.getElementById('setDirect').checked;
  const ta=document.getElementById('setStun');
  ta.disabled=direct;
  document.getElementById('directHint').style.display= direct? 'block':'none';
  if(!direct && !ta.value.trim()) ta.value=DEFAULT_STUN.join('\n'); // 取消勾选且为空时回填默认
}
function saveSettings(){
  store.identity.name=document.getElementById('setName').value.trim()||store.identity.name;
  const direct=document.getElementById('setDirect').checked;
  store.settings.directOnly=direct;
  store.settings.stunServers= direct? [] : document.getElementById('setStun').value.split('\n').map(s=>s.trim()).filter(Boolean);
  saveStore(); renderIdentity(); closeDialog('dlgSettings'); toast("已保存");
}

/* ===================== 导入导出 ===================== */
function exportJSON(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  a.download=`p2pchat-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  a.href=URL.createObjectURL(blob); a.click();
  URL.revokeObjectURL(a.href); toast("已导出");
}
function importJSON(){ document.getElementById('fileInput').click(); }
document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.identity || !Array.isArray(d.contacts)) throw new Error("格式不符");
      if(!confirm("导入将覆盖当前数据，是否继续？")) return;
      store={...defaultStore(), ...d};
      if(!store.messages) store.messages={};
      if(!store.settings||!store.settings.stunServers) store.settings={stunServers:[...DEFAULT_STUN],directOnly:false};
      if(store.settings.directOnly===undefined) store.settings.directOnly=(store.settings.stunServers||[]).length===0;
      saveStore(); connections.clear(); currentId=null; renderAll(); toast("导入成功");
    }catch(err){ toast("导入失败: "+err.message); }
  };
  r.readAsText(f); e.target.value='';
});

/* ===================== 工具 ===================== */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function copyText(t){
  if(!t) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("已复制")).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast("已复制"); }catch(e){ toast("复制失败，请手动选择复制"); }
  document.body.removeChild(ta);
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

window.addEventListener('beforeunload', ()=>{ channelMap.forEach(i=>{try{i.pc.close();}catch(e){}}); });

/* 启动 */
renderAll();
</script>
</body>
</html>
